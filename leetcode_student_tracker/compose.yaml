services:
  tracker:
    build: .
    restart: unless-stopped
    environment:
      STUDENT_TRACKER_DB_PATH: /data/leetcode_tracker.db
    volumes:
      - tracker_data:/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      tracker:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to a DNS name pointed at this server}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true

volumes:
  tracker_data:
  caddy_data:
  caddy_config: